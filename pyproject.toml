[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "xclone-torch"
version = "0.1.0"
description = "PyTorch reimplementation of XClone for GPU-accelerated CNV inference"
readme = "README_PYTORCH.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "XClone PyTorch Contributors", email = "rthuang@connect.hku.hk"}
]
keywords = [
    "single-cell",
    "copy-number-variation",
    "cnv",
    "scRNA-seq",
    "variational-inference",
    "pytorch",
    "gpu"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=1.10.0",
    "numpy>=1.18",
    "pandas>=1.0",
    "scipy>=1.5",
    "anndata>=0.7",
    "scikit-learn>=0.23",
]

[project.urls]
Homepage = "https://github.com/single-cell-genetics/XClone"
Documentation = "https://xclone-cnv.readthedocs.io"
Repository = "https://github.com/single-cell-genetics/XClone"
"Bug Tracker" = "https://github.com/single-cell-genetics/XClone/issues"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.900",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "nbsphinx>=0.8",
]
